[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curvy"
version = "0.0.1"
description = "Régression symbolique compacte : d'un nuage de points 2D vers un front de Pareto de formules"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Billy Girboux" }]
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["curvy*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: test lent, exclu du cycle rapide (make test)",
    "gpu: nécessite un accélérateur",
]
